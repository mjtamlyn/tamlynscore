{% extends 'base.html' %}

{% block content %}
<header>
    <h1>Create a new Leg in {{ season }}</h1>
</header>

<div class="row">
    <div class="col3">
        <form action="." method="POST">
            {% csrf_token %}
            {{ form }}
            <input type="submit" class="btn" value="Create" />
        </form>
    </div>

    <div class="col3">
        {% include 'leagues/_organiser_zone.html' %}
    </div>
</div>
{% endblock %}
